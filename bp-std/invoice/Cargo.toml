[package]
name = "bp-invoice"
description = "Bitcoin addresses and invoices"
readme = "../README.md"
version = "0.12.0-rc.2"
keywords = ["bitcoin", "wallet", "descriptors", "psbt", "taproot"]
categories = ["cryptography::cryptocurrencies"]
authors = ["Dr Maxim Orlovsky <orlovsky@lnp-bp.org>"]
homepage = "https://lnp-bp.org"
repository = "https://github.com/BP-WG/bp-wallet"
rust-version = "1.82.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "invoice"

[dependencies]
amplify = { workspace = true }
commit_verify = { workspace = true }
strict_encoding = { workspace = true, optional = true }
bech32 = { workspace = true }
bp-consensus = { workspace = true }
serde = { workspace = true, optional = true }

[features]
default = []
all = ["serde", "strict_encoding"]
strict_encoding = ["dep:strict_encoding"]
serde = ["dep:serde", "bp-consensus/serde"]
