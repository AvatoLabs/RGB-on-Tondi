[package]
name = "bp-derive"
description = "Tondi addresses and invoices"
readme = "../README.md"
version = "0.12.0-rc.3"
keywords = ["tondi", "wallet", "descriptors", "pstt", "p2mr"]
categories = ["cryptography::cryptocurrencies"]
authors = ["Dr Maxim Orlovsky <orlovsky@lnp-bp.org>"]
homepage = "https://lnp-bp.org"
repository = "https://github.com/BP-WG/bp-wallet"
rust-version = "1.82.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "derive"

[dependencies]
amplify = { workspace = true }
commit_verify = { workspace = true }
bp-consensus = { workspace = true }
bp-invoice = { workspace = true }
sha2 = "0.10.8"
hmac = "0.12.1"
indexmap = { workspace = true }
serde = { workspace = true, optional = true }

[features]
default = []
all = []
serde = ["dep:serde", "bp-consensus/serde", "bp-invoice/serde"]
