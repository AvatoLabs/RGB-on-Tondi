[package]
name = "pstt"
version = "0.12.0-rc.3"
description = "Partially Signed Tondi Transaction (PSTT) library for Tondi L1"
keywords = ["tondi", "wallet", "descriptors", "pstt", "copperoot"]
categories = ["cryptography::cryptocurrencies"]
readme = "../README.md"
authors = ["Dr Maxim Orlovsky <orlovsky@lnp-bp.org>", "Avato Labs"]
homepage = "https://tondi.org"
repository = "https://github.com/AvatoLabs/RGB-on-Tondi"
rust-version = "1.82.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
amplify = { workspace = true }
commit_verify = { workspace = true, optional = true }
strict_encoding = { workspace = true, optional = true }
bp-consensus = { workspace = true, features = ["serde"] }
bp-core = { workspace = true, optional = true }
bp-derive = { workspace = true, features = ["serde"] }
descriptors = { workspace = true }
indexmap = { workspace = true }
tondi-vm.workspace = true
tondi-wallet-pstt.workspace = true
serde_json.workspace = true
serde.workspace = true

[features]
default = []
all = ["serde", "client-side-validation"]
client-side-validation = ["bp-core", "commit_verify", "strict_encoding"]
serde = ["bp-derive/serde", "indexmap/serde"]
