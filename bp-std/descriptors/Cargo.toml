[package]
name = "descriptors"
version = "0.12.0-rc.3"
description = "Tondi descriptors library (part of Tondi Protocol stack)"
keywords = ["tondi", "wallet", "descriptors", "pstt", "p2mr"]
categories = ["cryptography::cryptocurrencies"]
readme = "../README.md"
authors = ["Dr Maxim Orlovsky <orlovsky@lnp-bp.org>"]
homepage = "https://lnp-bp.org"
repository = "https://github.com/BP-WG/bp-wallet"
rust-version = "1.82.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "descriptors"

[dependencies]
amplify = { workspace = true }
bp-derive = { workspace = true }
commit_verify = { workspace = true }
indexmap = { workspace = true }
serde = { workspace = true, optional = true }

[features]
default = []
all = ["serde"]
serde = ["dep:serde", "bp-derive/serde", "indexmap/serde"]
