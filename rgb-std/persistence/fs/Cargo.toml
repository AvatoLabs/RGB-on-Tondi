[package]
name = "rgb-persist-fs"
version = "0.12.0-rc.3"
authors = ["Dr Maxim Orlovsky <orlovsky@lnp-bp.org>"]
description = "Filesystem persistence for RGB smart contracts"
repository = "https://github.com/RGB-WG/rgb-std"
homepage = "https://rgb.tech"
keywords = ["bitcoin", "lightning", "rgb", "smart-contracts", "lnp-bp"]
categories = ["algorithms", "cryptography", "science", "no-std"]
readme = "README.md"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.85.0"
exclude = [".github"]

[dependencies]
amplify.workspace = true
strict_encoding.workspace = true
sonic-persist-fs.workspace = true
rgb-std = { workspace = true, features = ["binfile"] }
aora.workspace = true

[features]

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(coverage_nightly)'] }
