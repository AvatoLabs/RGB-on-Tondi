[package]
name = "rgbx"
description = "RGB command-line toolbox utility"
version = "0.12.0-rc.3"
keywords = ["tondi", "p2mr", "rgb", "smart-contracts", "lnp-bp"]
categories = ["cryptography::cryptocurrencies"]
authors = ["Dr Maxim Orlovsky <orlovsky@lnp-bp.org>"]
homepage = "https://rgb.tech"
repository = "https://github.com/RGB-WG/rgb-std"
rust-version = "1.85.0"
edition = "2021"
license = "Apache-2.0"
readme = "../README.md"

[dependencies]
amplify.workspace = true
strict_encoding.workspace = true
hypersonic.workspace = true
sonix.workspace = true
bp-core.workspace = true
rgb-std = { workspace = true, features = ["binfile", "serde"] }
rgb-persist-fs.workspace = true
binfile.workspace = true
serde.workspace = true
serde_yaml = "0.9.34"
anyhow = "1.0.93"
clap = { version = "4.5.21", features = ["derive", "env"] }

[features]
defaul = ["tondi"]
all = ["tondi", "liquid", "prime"]

tondi = ["rgb-std/tondi"]
liquid = ["rgb-std/liquid"]
prime = ["rgb-std/prime"]

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(coverage_nightly)'] }
