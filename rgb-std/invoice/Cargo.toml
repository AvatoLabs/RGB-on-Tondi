[package]
name = "rgb-invoice"
description = "Invoice Library for RGB smart contracts"
version = "0.12.0-rc.3"
keywords = ["tondi", "p2mr", "rgb", "smart-contracts", "lnp-bp"]
categories = ["cryptography::cryptocurrencies"]
authors = ["Dr Maxim Orlovsky <orlovsky@lnp-bp.org>"]
homepage = "https://rgb.tech"
repository = "https://github.com/RGB-WG/rgb-std"
rust-version = "1.85.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
amplify.workspace = true
commit_verify.workspace = true
strict_encoding.workspace = true
baid64.workspace = true
hypersonic.workspace = true
sonic-callreq.workspace = true
bp-core = { workspace = true, optional = true }
rgb-core.workspace = true
serde = { workspace = true, optional = true }

[features]
default = ["std", "tondi"]
all = ["std", "uri", "tondi", "liquid", "prime", "serde"]

tondi = ["bp-core", "rgb-core/tondi"]
liquid = ["bp-core", "rgb-core/liquid"]
prime = ["rgb-core/prime"]
std = ["amplify/std", "sonic-callreq/std"]
uri = ["sonic-callreq/uri"]
serde = ["dep:serde", "sonic-callreq/serde", "bp-core/serde", "rgb-core/serde"]

[package.metadata.docs.rs]
features = ["all"]

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(coverage_nightly)'] }
