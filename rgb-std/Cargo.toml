# This project is now part of the RGB-X
# See the root Cargo.toml for workspace configuration

[package]
name = "rgb-std"
description = "Standard Library for RGB smart contracts"
version = "0.12.0-rc.3"
keywords = ["tondi", "p2mr", "rgb", "smart-contracts", "lnp-bp"]
categories = ["cryptography::cryptocurrencies"]
authors = ["Dr Maxim Orlovsky <orlovsky@lnp-bp.org>"]
homepage = "https://rgb.tech"
repository = "https://github.com/RGB-WG/rgb-std"
rust-version = "1.85.0"
edition = "2021"
license = "Apache-2.0"
readme = "README.md"

[[bin]]
name = "rgb-stl"
required-features = ["stl"]

[lib]
name = "rgb"
crate-type = ["cdylib", "rlib"] # We need this for WASM

[dependencies]
amplify = { workspace = true }
strict_encoding = { workspace = true }
strict_types = { workspace = true }
commit_verify = { workspace = true }
single_use_seals = { workspace = true }
aora = { workspace = true }
binfile = { workspace = true, optional = true }
hypersonic = "0.12.0"
bp-core = { workspace = true, optional = true }
rgb-core = { workspace = true }
rgb-invoice = { workspace = true }
indexmap = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true, optional = true }
serde_with = { version = "1.14", optional = true }

[dev-dependencies]
aluvm = { workspace = true }
rand = { workspace = true }
rgb-persist-fs = { workspace = true }

[features]
default = ["std", "tondi"]
all = ["std", "tondi", "liquid", "prime", "binfile", "uri", "stl", "serde", "async"]
std = ["rgb-invoice/std", "indexmap/std"]
async = []

tondi = ["bp-core", "rgb-core/tondi", "rgb-invoice/tondi"]
liquid = ["rgb-core/liquid", "rgb-invoice/liquid"]
prime = ["rgb-core/prime", "rgb-invoice/prime"]

uri = ["rgb-invoice/uri"]
binfile = ["std", "dep:binfile", "hypersonic/binfile", "aora/file-strict"]

stl = ["commit_verify/stl", "hypersonic/stl", "strict_types/armor", "tondi", "bp-core/stl"]

serde = [
    "std",
    "dep:serde",
    "dep:serde_with",
    "amplify/serde",
    "strict_encoding/serde",
    "strict_types/serde",
    "commit_verify/serde",
    "hypersonic/serde",
    "bp-core/serde",
    "rgb-core/serde",
    "rgb-invoice/serde",
    "chrono/serde"
]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
rand = { version = "0.9.1", optional = true }
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom2 = { package = "getrandom", version = "0.2", features = ["js"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[package.metadata.docs.rs]
features = ["all"]

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(coverage_nightly)'] }
