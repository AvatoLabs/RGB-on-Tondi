[workspace]
resolver = "2"

members = [
    # Core encoding libraries
    "strict-encoding/rust",
    "strict-encoding/rust/derive",
    "strict-encoding/rust/test_helpers",
    "strict-types",
    
    # AluVM and ZK
    "aluvm",
    "zk-aluvm",
    "ultrasonic",
    
    # Client-side validation
    "client_side_validation",
    "client_side_validation/commit_verify",
    "client_side_validation/commit_verify/derive",
    "client_side_validation/single_use_seals",
    
    # Tondi protocol core
    "bp-core",
    "bp-core/consensus",
    "bp-core/dbc",
    "bp-core/seals",
    
    # Tondi wallet standards
    "bp-std",
    "bp-std/invoice",
    "bp-std/derive",
    "bp-std/descriptors",
    "bp-std/pstt",
    
    # Tondi RPC Client (replaces Esplora client)
    "bp-tondi-client",
    
    # RGB Core
    "rgb-core",
    
    # RGB Standard
    "rgb-std",
    "rgb-std/cli",
    "rgb-std/invoice",
    "rgb-std/persistence/fs",
    
    # RGB Runtime
    "rgb",
    "rgb/pstt",
    "rgb/descriptors",
    "rgb/cli",
    
    # RGB Interfaces (Standard RGB20/21/25)
    "rgb-interfaces",
    
    # Sonare - currently disabled due to sonic dependency issues
    # "sonare",
    # "sonare/cli",
    # "sonare/inmem",
]

[workspace.package]
authors = ["Dr Maxim Orlovsky <orlovsky@lnp-bp.org>", "Avato Labs"]
edition = "2021"
rust-version = "1.85.0"
license = "Apache-2.0"
repository = "https://github.com/AvatoLabs/RGB-X"
homepage = "https://github.com/AvatoLabs/RGB-X"

[workspace.dependencies]
# Native Tondi v4 is shared with the sibling node; no copied wire codec.
tondi-vm = { path = "../Tondi/vm" }
tondi-consensus-core = { path = "../Tondi/consensus/core" }
tondi-rpc-core = { path = "../Tondi/rpc/core" }
tondi-grpc-client = { path = "../Tondi/rpc/grpc/client" }
tondi-wrpc-client = { path = "../Tondi/rpc/wrpc/client" }
tondi-wallet-pstt = { path = "../Tondi/wallet/pstt" }
workflow-core = "0.18"
borsh = { version = "1.8.0", features = ["derive"] }
# External dependencies
amplify = { version = "4.9.0", default-features = true }
bech32 = "0.9.1"
secp256k1 = { version = "0.30.0", features = ["global-context"] }
sha2 = "0.10.8"
blake3 = "1.5"
indexmap = "2.9.0"
futures = "0.3.31"
chrono = "0.4.41"
serde = { version = "1", features = ["derive"] }
serde_with = "3.11"
serde_json = "1.0"
serde_yaml = "0.9.19"
toml = "0.8.22"
log = "0.4"
paste = "1"
baid64 = "0.4.2"
binfile = "0.2.0"
aora = ">=0.6.4"
ascii-armor = "0.9.0"
vesper-lang = "0.2.1"
minreq = "2.11.0"
reqwest = "0.12"
tokio = "1"
wasm-bindgen = "0.2"
wasm-bindgen-test = "0.3"
rand = "0.9.1"
getrandom = "0.3"
thiserror = "2.0"
async-trait = "0.1"
hex = { version = "0.4", features = ["serde"] }

# Workspace internal dependencies - strict encoding/types
strict_encoding = { version = "2.9.1", path = "./strict-encoding/rust", default-features = true }
strict_encoding_derive = { version = "2.9.1", path = "./strict-encoding/rust/derive" }
strict_types = { version = "2.9.0", path = "./strict-types" }

# Workspace internal dependencies - AluVM
aluvm = { version = "0.12.0", path = "./aluvm" }
zk-aluvm = { version = "0.12.0", path = "./zk-aluvm" }
ultrasonic = { version = "0.12.0", path = "./ultrasonic" }

# Workspace internal dependencies - client-side validation
commit_verify = { version = "0.12.0", path = "./client_side_validation/commit_verify", default-features = true }
commit_verify_derive = { version = "0.12.0", path = "./client_side_validation/commit_verify/derive" }
single_use_seals = { version = "0.12.0", path = "./client_side_validation/single_use_seals" }
client_side_validation = { version = "0.12.0", path = "./client_side_validation" }

# Workspace internal dependencies - Tondi protocol
bp-consensus = { version = "0.12.0", path = "./bp-core/consensus" }
bp-dbc = { version = "0.12.0", path = "./bp-core/dbc" }
bp-seals = { version = "0.12.0", path = "./bp-core/seals" }
bp-core = { version = "0.12.0", path = "./bp-core" }

bp-invoice = { version = "0.12.0-rc.2", path = "./bp-std/invoice" }
bp-derive = { version = "0.12.0-rc.3", path = "./bp-std/derive" }
descriptors = { version = "0.12.0-rc.3", path = "./bp-std/descriptors" }
pstt = { version = "0.12.0-rc.3", path = "./bp-std/pstt" }
bp-std = { version = "0.12.0-rc.3", path = "./bp-std" }

bp-tondi = { version = "0.1.0", path = "./bp-tondi-client" }

# Workspace internal dependencies - RGB
rgb-core = { version = "0.12.0", path = "./rgb-core" }
rgb-invoice = { version = "0.12.0-rc.3", path = "./rgb-std/invoice" }
rgb-persist-fs = { version = "0.12.0-rc.3", path = "./rgb-std/persistence/fs" }
rgb-std = { version = "0.12.0-rc.3", path = "./rgb-std" }

rgb-pstt = { version = "0.12.0-rc.3", path = "./rgb/pstt" }
rgb-descriptors = { version = "0.12.0-rc.3", path = "./rgb/descriptors" }
rgb-runtime = { version = "0.12.0-rc.3", path = "./rgb" }

# RGB Interfaces (RGB20/21/25 Standards)
rgb-interfaces = { version = "0.12.0", path = "./rgb-interfaces" }

# Workspace internal dependencies - Sonare
sonare = { version = "0.12.0-alpha.1", path = "./sonare" }

# External dependencies that are not yet in workspace
hypersonic = "0.12.0"
sonic-callreq = "0.12.0"
sonic-persist-fs = "0.12.0"
sonix = "0.12.0"
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
overflow-checks = true

[profile.dev]
opt-level = 0
debug = true

[patch.crates-io]
# Ensure all crates use local versions
strict_encoding = { path = "./strict-encoding/rust" }
strict_types = { path = "./strict-types" }
aluvm = { path = "./aluvm" }
zk-aluvm = { path = "./zk-aluvm" }
ultrasonic = { path = "./ultrasonic" }
commit_verify = { path = "./client_side_validation/commit_verify" }
single_use_seals = { path = "./client_side_validation/single_use_seals" }
bp-consensus = { path = "./bp-core/consensus" }
bp-dbc = { path = "./bp-core/dbc" }
bp-seals = { path = "./bp-core/seals" }
bp-core = { path = "./bp-core" }
bp-invoice = { path = "./bp-std/invoice" }
bp-std = { path = "./bp-std" }
rgb-core = { path = "./rgb-core" }
rgb-std = { path = "./rgb-std" }
rgb-interfaces = { path = "./rgb-interfaces" }

# Forked external crates with Tondi support
sonic-callreq = { path = "./external-forks/sonic-callreq" }
sonic-api = { path = "./external-forks/sonic-api" }

# External dependencies from git repositories are specified in individual crates
