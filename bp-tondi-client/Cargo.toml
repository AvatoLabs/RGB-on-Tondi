[package]
name = "bp-tondi"
version = "0.1.0"
edition = "2021"
authors = ["AvatoLabs"]
license = "MIT"
description = "Tondi RPC client library for RGB/BP integration"
keywords = ["tondi", "rgb", "kaspa", "p2mr", "blake3"]
readme = "README.md"
rust-version = "1.82.0"

[lib]
name = "tondi"
path = "src/lib.rs"

[dependencies]
amplify = { workspace = true, features = ["serde"] }
bp-core = { workspace = true, features = ["serde"] }
bp-invoice = { workspace = true }
commit_verify = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
hex = { workspace = true }

# Async runtime
tokio = { workspace = true, features = ["time", "rt-multi-thread"], optional = true }
tokio-stream = { version = "0.1", optional = true }
async-trait = { workspace = true, optional = true }

# For gRPC client (optional)
tonic = { version = "0.12", features = ["transport", "codegen"], optional = true }
prost = { version = "0.13", optional = true }

# For wRPC client (WebSocket)
workflow-rpc = { version = "0.18", optional = true }

# For BIP39 mnemonic to seed conversion
pbkdf2 = "0.12"
sha2 = { workspace = true }
blake3 = "1.5"
hmac = "0.12"

# For HD wallet derivation
bp-std = { workspace = true }

# For RGB asset issuance
rgb-std = { workspace = true }
rgb-persist-fs = { workspace = true }
rgb-core = { workspace = true }
rgb-interfaces = { workspace = true }
strict_encoding = { workspace = true }
hypersonic = { workspace = true }

[build-dependencies]
tonic-build = { version = "0.12", features = ["prost"] }

[features]
default = ["async"]
async = ["dep:async-trait", "dep:tokio", "dep:tokio-stream"]
grpc = ["dep:tonic", "dep:prost"]
wrpc = ["dep:workflow-rpc"]
