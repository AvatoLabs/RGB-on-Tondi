[package]
name = "bp-tondi"
version = "0.1.0"
edition = "2021"
authors = ["AvatoLabs"]
license = "MIT"
description = "Tondi RPC client library for RGB/BP integration"
keywords = ["tondi", "rgb", "kaspa", "p2mr", "blake3"]
readme = "README.md"
rust-version = "1.82.0"

[lib]
name = "tondi"
path = "src/lib.rs"

[dependencies]
amplify = { workspace = true, features = ["serde"] }
bp-core = { workspace = true, features = ["serde"] }
bp-invoice = { workspace = true }
commit_verify = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
hex = { workspace = true }
anyhow = "1.0.93"

# Async runtime
tokio = { workspace = true, features = ["macros", "time", "rt-multi-thread"] }

tondi-vm.workspace = true
tondi-consensus-core.workspace = true
tondi-rpc-core.workspace = true
tondi-grpc-client.workspace = true
tondi-wrpc-client.workspace = true

# For BIP39 mnemonic to seed conversion
pbkdf2 = "0.12"
sha2 = { workspace = true }
blake3 = "1.5"
hmac = "0.12"

# For HD wallet derivation
bp-std = { workspace = true }

# For RGB asset issuance
rgb-std = { workspace = true }
rgb-persist-fs = { workspace = true }
rgb-core = { workspace = true }
rgb-interfaces = { workspace = true }
strict_encoding = { workspace = true }
hypersonic = { workspace = true }
