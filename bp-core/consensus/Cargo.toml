[package]
name = "bp-consensus"
version = "0.12.0"
description = "Tondi protocol consensus library"
keywords = ["tondi", "smart-contracts", "kaspa", "blockchain", "blake3"]
categories = ["cryptography"]
authors = ["Dr Maxim Orlovsky <orlovsky@lnp-bp.org>", "AvatoLabs"]
repository = "https://github.com/AvatoLabs/RGB-on-Tondi"
homepage = "https://github.com/AvatoLabs/RGB-on-Tondi"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.81.0"
readme = "../README.md"

[lib]
name = "bc"

[dependencies]
amplify = { workspace = true }
strict_encoding = { workspace = true }
strict_types = { workspace = true, optional = true }
commit_verify = { workspace = true }
secp256k1 = { workspace = true }
serde = { workspace = true, optional = true }
chrono = { version = "0.4.38", optional = true }
sha2 = { workspace = true }

[features]
default = ["chrono"]
all = ["chrono", "stl", "serde"]
stl = ["strict_types"]
chrono = ["dep:chrono"]
strict_types = ["dep:strict_types"]
serde = [
    "dep:serde",
    "amplify/serde",
    "secp256k1/serde"
]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
rand = { version = "0.9.1", optional = true }
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom2 = { package = "getrandom", version = "0.2", features = ["js"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[package.metadata.docs.rs]
features = ["all"]

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(coverage_nightly)'] }
