[package]
name = "bp-dbc"
version = "0.12.0"
description = "Deterministic tondi commitments library"
keywords = ["lnp-bp", "tondi", "blockchain", "smart-contracts", "single-use-seals"]
categories = ["cryptography", "encoding"]
authors = ["Dr Maxim Orlovsky <orlovsky@lnp-bp.org>"]
repository = "https://github.com/BP-WG/bp-core"
homepage = "https://github.com/BP-WG"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.81.0"
readme = "../README.md"

[lib]
name = "dbc"
path = "src/lib.rs"

[dependencies]
amplify = { workspace = true }
base85 = "=2.0.0"
strict_encoding = { workspace = true }
commit_verify = { workspace = true, features = ["rand"] }
bp-consensus = { workspace = true }
secp256k1 = { workspace = true }
serde = { workspace = true, optional = true }

[features]
default = []
all = ["serde"]
serde = [
    "dep:serde",
    "bp-consensus/serde",
    "commit_verify/serde",
    "secp256k1/serde"
]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
rand = { version = "0.9.1", optional = true }
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom2 = { package = "getrandom", version = "0.2", features = ["js"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[package.metadata.docs.rs]
features = ["all"]

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(coverage_nightly)'] }
