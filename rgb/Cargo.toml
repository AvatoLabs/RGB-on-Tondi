# This project is now part of the RGB-X
# See the root Cargo.toml for workspace configuration

[package]
name = "rgb-runtime"
description = "RGB smart contracts wallet runtime"
version = "0.12.0-rc.3"
keywords = ["bitcoin", "lightning", "rgb", "smart-contracts", "lnp-bp"]
categories = ["cryptography::cryptocurrencies"]
authors = ["Dr Maxim Orlovsky <orlovsky@lnp-bp.org>"]
homepage = "https://rgb.tech"
repository = "https://github.com/RGB-WG/rgb"
rust-version = "1.85.0"
edition = "2021"
license = "Apache-2.0"
readme = "README.md"

[lib]
name = "rgbp"
crate-type = ["cdylib", "rlib"]

[dependencies]
amplify = { workspace = true }
commit_verify = { workspace = true }
strict_types = { workspace = true }
bp-std = { workspace = true, features = ["client-side-validation"] }
bp-electrum = { version = "0.12.0-rc.1", optional = true }
bp-tondi = { workspace = true, default-features = false, optional = true }
rgb-std = { workspace = true, features = ["bitcoin"] }
rgb-pstt = { workspace = true, features = ["bp"] }
rgb-descriptors = { workspace = true }
rgb-persist-fs = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
indexmap = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
serde = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
log = { workspace = true, features = ["max_level_trace", "release_max_level_debug"], optional = true }

[dev-dependencies]
toml = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
rand = { version = "0.9.1", optional = true }
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom2 = { package = "getrandom", version = "0.2", features = ["js"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[features]
default = ["std"]
all = [
    "std",
    "serde", "log", "fs",
    "resolvers-all",
]
all-async = [
    "std", "async",
    "serde", "log",
    "resolvers-all-async",
]
std = []
async = ["futures", "rgb-std/async"]
fs = [
    "std",
    "serde",
    "rgb-std/binfile",
    "dep:rgb-persist-fs",
]
log = ["dep:log"]

resolvers-all = [
    "resolver-electrum",
    #"resolver-bitcoinrpc"
]
resolver-electrum = ["dep:bp-electrum"]
#resolver-bitcoinrpc = [] # TODO

resolvers-all-async = [
    #"resolver-electrum-async",
    "resolver-tondi",
    #"resolver-bitcoinrpc-async"
]
#resolver-electrum-async = ["async", "dep:bp-electrum"] # TODO: ["bp-electrum/async"]
# Tondi client is async-only
resolver-tondi = ["async", "bp-tondi/async"]
resolver-tondi-async = ["resolver-tondi"]
#resolver-bitcoinrpc-async = ["async"] # TODO

serde = [
    "dep:serde", "toml",
    "bp-std/serde", "rgb-std/serde", "rgb-descriptors/serde"
]

[package.metadata.docs.rs]
features = ["all"]
