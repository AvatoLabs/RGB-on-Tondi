[package]
name = "rgb-psbt"
description = "Partially-signed transaction support for RGB protocol"
version = "0.12.0-rc.3"
keywords = ["bitcoin", "lightning", "rgb", "smart-contracts", "lnp-bp"]
categories = ["cryptography::cryptocurrencies"]
authors = ["Dr Maxim Orlovsky <orlovsky@lnp-bp.org>"]
homepage = "https://rgb.tech"
repository = "https://github.com/RGB-WG/rgb"
rust-version = "1.85.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "rgpsbt"

[dependencies]
amplify = { workspace = true }
rgb-std = { workspace = true, features = ["bitcoin"] }
bp-core = { workspace = true }
bp-std = { workspace = true, optional = true }

[features]
default = []
all = ["bp", "rust-bitcoin"]

bp = ["bp-std"]
rust-bitcoin = []
