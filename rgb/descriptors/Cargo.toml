[package]
name = "rgb-descriptors"
description = "Tondi P2MR wallet descriptors for RGB protocol"
version = "0.12.0-rc.3"
keywords = ["tondi", "p2mr", "rgb", "smart-contracts", "lnp-bp"]
categories = ["cryptography::cryptocurrencies"]
authors = ["Dr Maxim Orlovsky <orlovsky@lnp-bp.org>"]
homepage = "https://rgb.tech"
repository = "https://github.com/RGB-WG/rgb"
rust-version = "1.85.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "rgbdescr"

[dependencies]
amplify = { workspace = true }
commit_verify = { workspace = true }
bp-core = { workspace = true }
bp-std = { workspace = true }
indexmap = { workspace = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
serde = { workspace = true }
toml = { workspace = true }

[features]
default = []
all = ["serde"]

serde = ["dep:serde", "indexmap/serde", "bp-core/serde", "bp-std/serde"]
