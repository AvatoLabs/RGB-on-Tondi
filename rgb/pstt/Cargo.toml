[package]
name = "rgb-pstt"
description = "Partially Signed Tondi Transaction (PSTT) support for RGB protocol on Tondi"
version = "0.12.0-rc.3"
keywords = ["tondi", "rgb", "smart-contracts", "pstt", "copperoot"]
categories = ["cryptography::cryptocurrencies"]
authors = ["Dr Maxim Orlovsky <orlovsky@lnp-bp.org>", "Avato Labs"]
homepage = "https://tondi.org"
repository = "https://github.com/AvatoLabs/RGB-on-Tondi"
rust-version = "1.85.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "rgpstt"

[dependencies]
amplify = { workspace = true }
rgb-std = { workspace = true, features = ["tondi"] }
bp-core = { workspace = true }
bp-std = { workspace = true, optional = true }

[features]
default = []
all = ["bp", "rust-tondi"]

bp = ["bp-std", "bp-std/client-side-validation"]
rust-tondi = []
