[package]
name = "strict_encoding_derive"
version = "2.9.1"
description = "Strict encoding derivation macros"
keywords = ["strict-encoding", "proc-macro"]
categories = ["development-tools", "encoding"]
authors = ["Dr Maxim Orlovsky <orlovsky@ubideco.org>"]
repository = "https://github.com/strict-types/strict-encoding"
homepage = "https://strict-types.org"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.77.0"
readme = "README.md"

[lib]
proc-macro = true

[dependencies]
quote = "1"
syn = { version = "1", features = ["full"] }
proc-macro2 = "1"
amplify_syn = "2.0.1"
heck = "0.5.0"

[dev-dependencies]
strict_encoding = { path = ".." }
strict_encoding_test = { path = "../test_helpers" }
amplify = { workspace = true }
