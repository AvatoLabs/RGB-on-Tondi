[package]
name = "sonare-cli"
description = "SONARE command-line interface"
categories = ["cryptography", "science", "command-line-interface"]
version = "0.12.0-alpha.1"
authors = ["Dr Maxim Orlovsky <orlovsky@ubideco.org>"]
repository = "https://github.com/AluVM/sonare"
homepage = "https://ubideco.org/SONARE"
keywords = ["state-machines", "distributed-systems", "decentralized", "partially-replicated", "runtime-environment"]
readme = "README.md"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77.0"

[dependencies]
sonare = { version = "0.12.0-alpha.1", path = ".." }
clap = { version = "4.5.21", features = ["derive", "env"] }
