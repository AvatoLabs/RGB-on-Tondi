[package]
name = "sonare-inmem"
version = "0.12.0-alpha.1"
authors = ["Dr Maxim Orlovsky <orlovsky@ubideco.org>"]
description = "In-memory persistence for SONARE"
repository = "https://github.com/AluVM/sonare"
homepage = "https://ubideco.org/SONARE"
keywords = ["state-machines", "distributed-systems", "decentralized", "partially-replicated", "runtime-environment"]
categories = ["algorithms", "cryptography", "science", "no-std"]
readme = "README.md"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77.0"
exclude = [".github"]

[dependencies]
amplify = { workspace = true }
strict_encoding = { workspace = true }
strict_types = { workspace = true, optional = true }
ultrasonic = { workspace = true }
sonic = { git = "https://github.com/AluVM/sonic" }
sonare = { version = "0.12.0-alpha.1", path = ".." }
serde = { workspace = true, optional = true }

[features]
default = ["std"]
all = ["std", "stl", "serde"]

std = []

stl = ["sonic/stl", "strict_types/armor"]
serde = [
    "dep:serde",
    "amplify/serde",
    "strict_encoding/serde",
    "ultrasonic/serde",
    "sonic/serde",
]
