# Tondi-native RGB20 asset issue parameters.
# RGB commitments are carried by P2MR output roots; do not put RGB data in payloads,
# signature_script, witness, Annex, or sidecar pointers on-chain.

consensus: tondi-testnet
testnet: true
issuer:
  codexId: 7C15w3W1-L0T~zXw-Aeh5~kV-Zquz729-HXQFKQW-_5lX9O8
  version: 0
  checksum: AYkSrg
name: TestToken
method: issue
timestamp: "2024-12-18T10:32:00Z"

global:
  - name: ticker
    verified: TEST
  - name: name
    verified: Test Token
  - name: precision
    verified: 8
  - name: issued
    verified: 1000000

owned:
  - name: balance
    seal: <REPLACE_WITH_TONDI_OUTPOINT>
    data: 1000000

# Usage:
# 1. Replace <REPLACE_WITH_TONDI_OUTPOINT> with a seal from:
#    RGB_WALLET=<name> rgb --tondi=<grpc-endpoint> seals
# 2. Adjust ticker, name, precision, and issued amount.
# 3. Issue with:
#    RGB_WALLET=<name> rgb --tondi=<grpc-endpoint> issue <this-file>.yaml







